# Isolated WhatsApp webhook stack for webhook.infradealer.com
# Does NOT bind host 80/443 (shared-edge owns those).
# Does NOT modify: crm-ecomalwa, crypto-ai-trads, mt-crm, infra, shared-edge compose.

services:
  db:
    image: postgres:16-alpine
    container_name: webhook-infradealer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infradealer}
      POSTGRES_USER: ${POSTGRES_USER:-infradealer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infradealer} -d ${POSTGRES_DB:-infradealer}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: webhook-infradealer-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  api:
    build:
      context: ./backend
    container_name: webhook-infradealer-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-infradealer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-infradealer}
      AI_MEDIA_DIR: /app/data/media
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ai_media:/app/data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - internal
      - edge

  web:
    build:
      context: ./frontend
    container_name: webhook-infradealer-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:9088:80"
    networks:
      - internal
      - edge

networks:
  internal:
  edge:
    external: true
    name: crypto-ai-trads_default

volumes:
  pgdata:
  ai_media:
